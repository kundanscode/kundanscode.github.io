name: Update Medium posts

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Medium feed into blogs.json
        run: |
          python3 - <<'PY'
          import json, re, html, urllib.request
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          FEED = "https://medium.com/feed/@kundanscode"
          NS = {"content": "http://purl.org/rss/1.0/modules/content/"}

          def strip(h):
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", h or ""))).strip()

          req = urllib.request.Request(FEED, headers={"User-Agent": "Mozilla/5.0 (compatible; portfolio-feed/1.0)"})
          raw = urllib.request.urlopen(req, timeout=30).read()
          root = ET.fromstring(raw)

          posts = []
          for item in root.iter("item"):
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").split("?")[0]
              body = item.findtext("content:encoded", namespaces=NS) or item.findtext("description") or ""
              text = strip(body)
              if text.startswith(title):
                  text = text[len(title):].strip()
              cats = [c.text for c in item.findall("category") if c.text]
              posts.append({
                  "title": title,
                  "link": link,
                  "date": parsedate_to_datetime(item.findtext("pubDate")).date().isoformat(),
                  "tag": cats[0].replace("-", " ").title() if cats else "Medium",
                  "excerpt": (text[:150].rsplit(" ", 1)[0] + "…") if len(text) > 150 else text,
                  "minutes": max(1, round(len(strip(body).split()) / 200)),
              })

          if not posts:
              raise SystemExit("No posts found in feed; leaving blogs.json untouched")
          with open("blogs.json", "w", encoding="utf-8") as f:
              json.dump(posts[:6], f, indent=2, ensure_ascii=False)
          print(f"Wrote {min(len(posts), 6)} posts")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blogs.json
          git diff --cached --quiet || (git commit -m "Update Medium posts" && git push)
